name: Initialize source tree

on:
  push:
    branches: [main]
    paths: ['snapshot.b64']

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode snapshot.b64 | tar -xz
          test -f package.json
          test -f app/engine.cjs
          test -f .github/workflows/release.yml
          # GitHub Actions tokens cannot modify workflow files: publish this separately.
          rm -f .github/workflows/release.yml snapshot.b64
      - name: Commit source files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat: initialize You Want Download desktop app"
          git push origin main
