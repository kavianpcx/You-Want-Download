name: Initialize source tree

on:
  push:
    branches: [main]
    paths: ['snapshot.b64']

permissions:
  contents: write
  actions: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode snapshot.b64 | tar -xz
          test -f package.json
          test -f app/engine.cjs
          test -f .github/workflows/release.yml
          rm -f snapshot.b64 .github/workflows/bootstrap.yml
      - name: Commit original source files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat: initialize You Want Download desktop app"
          git push origin main
      - name: Run Windows release workflow after source push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run release.yml --ref main; then exit 0; fi
            sleep 10
          done
          exit 1
